<!doctype html>
<html lang="en">
    <head>
        <title>Sign Up</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="css/style_signup.css">
    </head>
    <body>
        <section class="ftco-section">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 text-center mb-1">
                        <h2 class="heading-section">Sign Up</h2>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="wrap d-md-flex">
                            <div class="text-wrap p-4 p-lg-5 d-flex img d-flex align-items-end" style="background-image: url(img-2/cat-cat-jumping.gif);">
                                
                            </div>
                            <div class="login-wrap p-4 p-md-5">
                                <h3 class="mb-3">Create an account</h3>
                                <form action="#" class="signup-form">
                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="form-group d-flex align-items-center">
                                                <label class="label" for="name">Full Name</label>
                                                <input type="text" class="form-control" placeholder="Full Name">
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-group d-flex align-items-center">
                                                <label class="label" for="email">Email Address</label>
                                                <input type="text" class="form-control" placeholder="ineedmoney@yahoo.com">
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-group d-flex align-items-center">
                                                <label class="label" for="phone">Phone no.</label>
                                                <input type="text" class="form-control" placeholder="+886">
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-group d-flex align-items-center">
                                                <label class="label" for="password">Password</label>
                                                <input type="password" class="form-control" placeholder="Password">
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-group d-flex align-items-center">
                                                <label class="label" for="website">Website</label>
                                                <input type="text" class="form-control" placeholder="Website">
                                            </div>
                                        </div>
                                        <div class="col-md-12 my-4">
                                            <div class="form-group">
                                                <div class="w-100">
                                                    <label class="checkbox-wrap checkbox-primary">I agree all statements in terms of service
                                                        <input type="checkbox" checked>
                                                        <span class="checkmark"></span>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-group">
                                                <a href="index.html" target="_parent" class="btn btn-secondary submit p-3">Create an account</a>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                                <div class="social-wrap">
                                    <p class="or">
                                        <span>or</span>
                                    </p>
                                    <p class="mb-3 text-center">Signup with this services</p>
                                    <p class="social-media d-flex justify-content-center">
                                        <a href="#" class="social-icon google d-flex align-items-center justify-content-center"><span class="fa fa-google"></span></a>
                                        <a href="#" class="social-icon facebook d-flex align-items-center justify-content-center"><span class="fa fa-facebook"></span></a>
                                        <a href="#" class="social-icon twitter d-flex align-items-center justify-content-center"><span class="fa fa-twitter"></span></a>
                                    </p>
                                </div>
                                <div class="w-100 text-center">
                                    <p class="mt-4">I'm already a member! <a href="#signin">Sign In</a></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <script src="js/jquery.min.js"></script>
        <script src="js/popper.js"></script>
        <script src="js/bootstrap.min.js"></script>
        <script src="js/main.js"></script>
        <script defer src="https://static.cloudflareinsights.com/beacon.min.js/vc733d5f01de84e3792a4035cd15c58a81717452547180" integrity="sha512-fqEn6JCqkzgyQXZxQOxB9z6GyWybXdsYNuqu0tW/ATUi0uJMKhFfYpk0taNyC90JiX4HZUqEp6nnOyL7/ZvjCA==" data-cf-beacon='{"rayId":"8912e12f1f6b4a9c","version":"2024.4.1","token":"cd0b4b3a733644fc843ef0b185f98241"}' crossorigin="anonymous"></script>
    </body>
</html>
